name: Test 1Password Connect credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: configure
        uses: .
        with:
          connect-host: https://my-connect.example.com
          connect-token: my-connect-token-value

      - name: Assert OP_CONNECT_HOST is exported
        run: |
          echo "OP_CONNECT_HOST: $OP_CONNECT_HOST"
          if [ "$OP_CONNECT_HOST" != "https://my-connect.example.com" ]; then
            echo "FAIL: expected OP_CONNECT_HOST to be 'https://my-connect.example.com', got '$OP_CONNECT_HOST'"
            exit 1
          fi
          echo "PASS: OP_CONNECT_HOST is set correctly"

      - name: Assert OP_CONNECT_TOKEN is exported
        run: |
          echo "OP_CONNECT_TOKEN: $OP_CONNECT_TOKEN"
          if [ "$OP_CONNECT_TOKEN" != "my-connect-token-value" ]; then
            echo "FAIL: expected OP_CONNECT_TOKEN to be 'my-connect-token-value', got '$OP_CONNECT_TOKEN'"
            exit 1
          fi
          echo "PASS: OP_CONNECT_TOKEN is set correctly"

      - name: Assert OP_SERVICE_ACCOUNT_TOKEN is not set
        run: |
          echo "OP_SERVICE_ACCOUNT_TOKEN: '$OP_SERVICE_ACCOUNT_TOKEN'"
          if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "FAIL: expected OP_SERVICE_ACCOUNT_TOKEN to be empty, got '$OP_SERVICE_ACCOUNT_TOKEN'"
            exit 1
          fi
          echo "PASS: OP_SERVICE_ACCOUNT_TOKEN is not set"
