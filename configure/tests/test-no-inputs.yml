name: Test no inputs provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: configure
        uses: .
        # No inputs provided — action should succeed without exporting any env vars

      - name: Assert action succeeded with no env vars set
        run: |
          echo "OP_CONNECT_HOST: '$OP_CONNECT_HOST'"
          echo "OP_CONNECT_TOKEN: '$OP_CONNECT_TOKEN'"
          echo "OP_SERVICE_ACCOUNT_TOKEN: '$OP_SERVICE_ACCOUNT_TOKEN'"
          if [ -n "$OP_CONNECT_HOST" ]; then
            echo "FAIL: expected OP_CONNECT_HOST to be empty, got '$OP_CONNECT_HOST'"
            exit 1
          fi
          if [ -n "$OP_CONNECT_TOKEN" ]; then
            echo "FAIL: expected OP_CONNECT_TOKEN to be empty, got '$OP_CONNECT_TOKEN'"
            exit 1
          fi
          if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "FAIL: expected OP_SERVICE_ACCOUNT_TOKEN to be empty, got '$OP_SERVICE_ACCOUNT_TOKEN'"
            exit 1
          fi
          echo "PASS: no env vars set when no inputs provided"
