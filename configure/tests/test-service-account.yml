name: Test service account token configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: configure
        uses: .
        with:
          service-account-token: ops_test_service_account_token_12345
      - name: Assert OP_SERVICE_ACCOUNT_TOKEN is exported
        run: |
          echo "OP_SERVICE_ACCOUNT_TOKEN: $OP_SERVICE_ACCOUNT_TOKEN"
          if [ "$OP_SERVICE_ACCOUNT_TOKEN" != "ops_test_service_account_token_12345" ]; then
            echo "FAIL: expected OP_SERVICE_ACCOUNT_TOKEN to be 'ops_test_service_account_token_12345', got '$OP_SERVICE_ACCOUNT_TOKEN'"
            exit 1
          fi
          echo "PASS"
      - name: Assert connect vars are not set
        run: |
          if [ -n "$OP_CONNECT_HOST" ]; then
            echo "FAIL: expected OP_CONNECT_HOST to be unset, got '$OP_CONNECT_HOST'"
            exit 1
          fi
          if [ -n "$OP_CONNECT_TOKEN" ]; then
            echo "FAIL: expected OP_CONNECT_TOKEN to be unset, got '$OP_CONNECT_TOKEN'"
            exit 1
          fi
          echo "PASS: connect vars are not set"
