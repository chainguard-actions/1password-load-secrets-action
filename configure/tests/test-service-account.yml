name: Test 1Password service account token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: configure
        uses: .
        with:
          service-account-token: ops_my-service-account-token

      - name: Assert OP_SERVICE_ACCOUNT_TOKEN is exported
        run: |
          echo "OP_SERVICE_ACCOUNT_TOKEN: $OP_SERVICE_ACCOUNT_TOKEN"
          if [ "$OP_SERVICE_ACCOUNT_TOKEN" != "ops_my-service-account-token" ]; then
            echo "FAIL: expected OP_SERVICE_ACCOUNT_TOKEN to be 'ops_my-service-account-token', got '$OP_SERVICE_ACCOUNT_TOKEN'"
            exit 1
          fi
          echo "PASS: OP_SERVICE_ACCOUNT_TOKEN is set correctly"

      - name: Assert OP_CONNECT_HOST is not set
        run: |
          echo "OP_CONNECT_HOST: '$OP_CONNECT_HOST'"
          if [ -n "$OP_CONNECT_HOST" ]; then
            echo "FAIL: expected OP_CONNECT_HOST to be empty, got '$OP_CONNECT_HOST'"
            exit 1
          fi
          echo "PASS: OP_CONNECT_HOST is not set"

      - name: Assert OP_CONNECT_TOKEN is not set
        run: |
          echo "OP_CONNECT_TOKEN: '$OP_CONNECT_TOKEN'"
          if [ -n "$OP_CONNECT_TOKEN" ]; then
            echo "FAIL: expected OP_CONNECT_TOKEN to be empty, got '$OP_CONNECT_TOKEN'"
            exit 1
          fi
          echo "PASS: OP_CONNECT_TOKEN is not set"
