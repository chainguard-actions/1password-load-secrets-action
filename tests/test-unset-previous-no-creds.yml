name: Test unset-previous with no credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When unset-previous=true and no credentials are configured, the action
      # should exit successfully with an informational message (no auth needed).
      - id: action
        uses: .
        with:
          unset-previous: "true"

      - name: Assert action succeeded
        run: |
          echo "PASS: action completed successfully with unset-previous=true and no credentials"
