name: Test action fails with no auth configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no auth (expect failure)
        id: action
        uses: .
        continue-on-error: true
        # No OP_SERVICE_ACCOUNT_TOKEN, OP_CONNECT_HOST/TOKEN, or Workload Identity vars set

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with no auth, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no auth is configured"
