name: Test action fails with conflicting auth methods
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with conflicting auth (Workload Identity + Service Account)
        id: action
        uses: .
        continue-on-error: true
        env:
          # Full Workload Identity config
          OP_WORKLOAD_ID: "some-workload-id"
          OP_ENVIRONMENT_ID: "some-environment-id"
          OP_INTEGRATION_KEY: "some-integration-key"
          # Also set a Service Account token — this conflicts with Workload Identity
          OP_SERVICE_ACCOUNT_TOKEN: "ops_some-fake-service-account-token"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with conflicting auth methods, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when Workload Identity and Service Account are both configured"
