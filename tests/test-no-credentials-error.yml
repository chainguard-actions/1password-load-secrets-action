name: Test error when no credentials configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When no credentials are provided and unset-previous=false (default),
      # the action should fail with an authentication error.
      - id: action
        uses: .
        with:
          unset-previous: "false"
          export-env: "false"
        continue-on-error: true

      - name: Assert action failed with auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected when no credentials are configured"
