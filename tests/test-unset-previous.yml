name: Test unset-previous input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          unset-previous: "true"
        env:
          # No credentials — action should fail gracefully after parsing inputs
          OP_CONNECT_HOST: ""
          OP_CONNECT_TOKEN: ""
      - name: Assert action handled unset-previous input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no credentials, unset-previous=true accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with unset-previous=true"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
