name: Test unset-previous no-op when no managed variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unset-previous=true and no OP_MANAGED_VARIABLES (expect failure at auth)
        id: action
        uses: .
        continue-on-error: true
        env:
          # Explicitly clear any credentials that might be set in the CI environment
          OP_CONNECT_HOST: ""
          OP_CONNECT_TOKEN: ""
          OP_SERVICE_ACCOUNT_TOKEN: ""
        with:
          unset-previous: "true"
          export-env: "false"
        # No OP_MANAGED_VARIABLES set, so unsetPrevious() is a no-op.
        # The action should still fail at validateAuth() since no credentials are provided.

      - name: Assert action failed (at auth step, not at unset-previous)
        if: always()
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at auth validation, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed at auth validation after no-op unset-previous"
