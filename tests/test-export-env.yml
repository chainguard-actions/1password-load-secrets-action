name: Test export-env flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          export-env: "true"
      - name: Assert action ran with export-env flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no 1Password credentials provided)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with export-env=true"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
