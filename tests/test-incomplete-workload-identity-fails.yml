name: Test action fails with incomplete Workload Identity config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with partial Workload Identity config (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          # Only set two of the three required Workload Identity vars — should fail
          OP_WORKLOAD_ID: "some-workload-id"
          OP_ENVIRONMENT_ID: "some-environment-id"
          # OP_INTEGRATION_KEY is intentionally missing

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with incomplete Workload Identity config, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with incomplete Workload Identity configuration"
