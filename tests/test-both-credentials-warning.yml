name: Test warning when both Connect and Service Account credentials are provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with both Connect and Service Account credentials (expect warning + failure at CLI)
        id: action
        uses: .
        continue-on-error: true
        env:
          OP_CONNECT_HOST: "https://fake-connect.example.com"
          OP_CONNECT_TOKEN: "fake-connect-token"
          OP_SERVICE_ACCOUNT_TOKEN: "ops_fake_service_account_token"
          # Add an op:// reference so the action tries to read a secret and fails with the fake credentials
          TEST_SECRET: "op://test-vault/test-item/test-field"
        with:
          export-env: "false"

      - name: Assert action failed (expected - fake credentials cannot authenticate with 1Password CLI)
        if: always()
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          # The action should fail because the fake credentials cannot authenticate with the 1Password CLI.
          # validateAuth() should have passed (both credential types are set) and logged a warning.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake Connect and Service Account credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when using fake Connect and Service Account credentials"
