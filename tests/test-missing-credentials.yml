name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without any credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          # Explicitly clear any credentials that might be set in the CI environment
          OP_CONNECT_HOST: ""
          OP_CONNECT_TOKEN: ""
          OP_SERVICE_ACCOUNT_TOKEN: ""
        with:
          export-env: "false"

      - name: Assert action failed due to missing credentials
        if: always()
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no credentials are provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no credentials were provided"
