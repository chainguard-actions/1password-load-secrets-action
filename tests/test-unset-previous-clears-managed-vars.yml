name: Test unset-previous clears managed variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Simulate a previous step that exported secrets managed by 1Password.
      # OP_MANAGED_VARIABLES tracks which env vars were set by the action.
      - name: Simulate previously loaded secrets
        run: |
          echo "MY_SECRET=supersecret" >> "$GITHUB_ENV"
          echo "OP_MANAGED_VARIABLES=MY_SECRET" >> "$GITHUB_ENV"

      - name: Verify managed variable is set before unset
        run: |
          echo "MY_SECRET value: $MY_SECRET"
          if [ -z "$MY_SECRET" ]; then
            echo "FAIL: MY_SECRET should be set before unset-previous runs"
            exit 1
          fi
          echo "PASS: MY_SECRET is set as expected"

      # Run the action with unset-previous=true; it should clear MY_SECRET
      # because it is listed in OP_MANAGED_VARIABLES.
      - id: action
        uses: .
        with:
          unset-previous: "true"

      - name: Assert managed variable was cleared
        run: |
          echo "MY_SECRET value after unset: '$MY_SECRET'"
          if [ -n "$MY_SECRET" ]; then
            echo "FAIL: MY_SECRET should have been unset by the action"
            exit 1
          fi
          echo "PASS: MY_SECRET was successfully cleared by unset-previous"
