name: Test unset-previous with no credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with unset-previous and no credentials
        id: action
        uses: .
        with:
          unset-previous: "true"
          export-env: "false"
      - name: Assert action succeeded (no failure when unset-previous with no auth)
        run: |
          echo "Action completed without failure as expected"
          echo "PASS"
