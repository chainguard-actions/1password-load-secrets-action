name: Test service account auth path (fake token, fails at CLI)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fake service account token (passes auth check, fails at CLI)
        id: action
        uses: .
        continue-on-error: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: "ops_fake_token_for_testing_only"
          # Add an op:// reference so the action tries to read a secret and fails with the fake token
          TEST_SECRET: "op://test-vault/test-item/test-field"
        with:
          export-env: "false"

      - name: Assert action failed (expected - fake token cannot authenticate with 1Password CLI)
        if: always()
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          # The action should fail because the fake token cannot authenticate with the 1Password CLI.
          # It should NOT fail at the auth validation step (validateAuth passes with a token set).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when using a fake service account token"
