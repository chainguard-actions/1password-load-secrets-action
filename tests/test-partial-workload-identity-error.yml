name: Test error on partial Workload Identity configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When only some of the three Workload Identity env vars are set
      # (OP_WORKLOAD_ID, OP_ENVIRONMENT_ID, OP_INTEGRATION_KEY), the action
      # should fail with an "Incomplete Workload Identity configuration" error.
      - id: action
        uses: .
        with:
          unset-previous: "false"
        env:
          OP_WORKLOAD_ID: "some-workload-id"
          # OP_ENVIRONMENT_ID and OP_INTEGRATION_KEY intentionally omitted
        continue-on-error: true

      - name: Assert action failed with incomplete config error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to incomplete Workload Identity config, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected with partial Workload Identity configuration"
